name: FocoLab - executor experimental
on:
  push:
    branches: [main]
    paths:
      - 'agent/run.py'
      - '.github/workflows/agent.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 19-20 22 10 *'
    - cron: '0 21 22 10 *'
permissions:
  contents: write
concurrency:
  group: focolab-agent
  cancel-in-progress: false
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute permitted iteration
        run: python agent/run.py
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if ! git diff --cached --quiet; then
            git commit -m "FocoLab: rotina gratuita"
            git push
          fi
